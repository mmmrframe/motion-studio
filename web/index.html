<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Onest (OFL) — замена фирменного ONY One в предпросмотре; метрики подогнаны под проект */
@font-face{font-family:Onest;font-weight:300;font-display:swap;src:url(fonts/onest-cyrillic-300-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:300;font-display:swap;src:url(fonts/onest-latin-300-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Onest;font-weight:400;font-display:swap;src:url(fonts/onest-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:400;font-display:swap;src:url(fonts/onest-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Onest;font-weight:500;font-display:swap;src:url(fonts/onest-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:500;font-display:swap;src:url(fonts/onest-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0a0a0b; --panel:#111113; --panel2:#17171a; --field:#0b0b0d;
  --line:#26262b; --line2:#33333a; --text:#f4f4f5; --mute:#8d8d96; --dim:#5d5d66;
  --acc:#ff6a2b; --acc2:#ff8d55; --accbg:rgba(255,106,43,.08); --ok:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px 80px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-size:20px;color:#1a0d06}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:8px 16px;font-weight:500;font-size:14px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pill.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* banner */
.banner{margin:28px 0 32px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px 20px 18px 24px;display:flex;gap:20px;align-items:center}
.banner p{flex:1;color:var(--mute);font-size:14px}
.banner p b{color:var(--text)}
.banner .key{display:flex;gap:10px;flex:1.2}
.input{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:13px 16px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--acc)}
.input::placeholder{color:var(--dim)}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:12px 20px;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#4a4a52}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#1a0d06}
.btn.acc:hover{background:var(--acc2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:8px 14px;border-radius:10px;font-size:13px}
.btn.ghost{background:transparent}

/* layout */
.grid{display:grid;grid-template-columns:440px 1fr;gap:40px;align-items:start}
#right{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin}
@media (max-width:1100px){#right{position:static;max-height:none}}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:26px}
.seg button{padding:11px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.seg small{font-size:11px;font-weight:500;color:var(--dim);margin-left:6px}

.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:22px}
.bars button{height:4px;border-radius:2px;background:var(--line)}
.bars button.done{background:#d9d9de}
.bars button.cur{background:var(--acc)}
.bars button.skip{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.stephead{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.stephead .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;letter-spacing:0;color:var(--text)}
.stephead .of{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim)}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:12px 0 4px}
.lead{color:var(--mute);font-size:14px;margin-bottom:20px}
label.f{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin:18px 0 8px}
label.f span{font-weight:500;color:var(--dim);font-size:12px}
.hint{color:var(--dim);font-size:12.5px;margin-top:8px}
.or{color:var(--dim);font-size:13px;text-align:center;margin:16px 0;display:flex;align-items:center;gap:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--field)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--accbg)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop span{color:var(--mute);font-size:13px}
.srcok{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:12px 14px;margin-top:14px}
.srcok .ic{width:36px;height:36px;border-radius:9px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-size:16px}
.srcok div{flex:1;min-width:0}
.srcok b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcok small{color:var(--mute);font-size:12.5px}
.link{color:var(--acc);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:14px 16px;transition:.15s;position:relative}
.opt:hover{border-color:#4a4a52}
.opt.on{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.opt b{display:block;font-size:15px;margin-bottom:2px}
.opt span{color:var(--mute);font-size:13px}
.opt .tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:6px;padding:2px 7px}

.music{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.music h4{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.track{text-align:left;border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:12px;transition:.15s}
.track.on{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.track .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.track .play{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:none}
.track.playing .play{background:var(--acc);color:#1a0d06;border-color:var(--acc)}
.track b{font-size:14px;display:block;line-height:1.2}
.track small{color:var(--mute);font-size:12px}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{flex:1;background:var(--line2);border-radius:1px}
.track.on .wave i{background:rgba(255,106,43,.55)}
.track.playing .wave i{animation:wv .7s ease-in-out infinite alternate}
@keyframes wv{to{transform:scaleY(.35)}}

.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{text-align:left;border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:8px 8px 12px;transition:.15s}
.scene.on{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.scene .th{aspect-ratio:16/9;border-radius:9px;overflow:hidden;margin-bottom:10px}
.scene b{display:block;font-size:13.5px;padding:0 4px;line-height:1.25}
.scene span{display:block;color:var(--mute);font-size:12px;padding:2px 4px 0}
.scene.wide{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:8px}
.scene.wide .th{width:130px;flex:none;margin:0}

.caps{display:grid;gap:8px;margin-top:4px}
.cap{border:1px solid var(--line2);background:var(--field);border-radius:12px;padding:8px}
.caprow{display:flex;gap:8px;align-items:flex-start}
.capopts{display:grid;gap:6px;margin-top:6px}
.capopts .r2{display:flex;gap:6px}
.chips{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
.chips button{flex:1;padding:5px 6px;font-size:12px;font-weight:500;border-radius:7px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px}
.chips button:hover{color:var(--text)}
.chips button.on{background:var(--acc);color:#1a0d06;font-weight:600}
.chips svg{width:14px;height:14px;display:block}
.r2 .chips:first-child{flex:1.4}.r2 .chips:last-child{flex:1}
.cap.sel{border-color:var(--acc)}
.cap .t{font:500 12px "JetBrains Mono",monospace;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 8px;white-space:nowrap;flex:none}
.cap .t.free{font-family:Inter;color:var(--mute)}
.cap textarea{flex:1;background:transparent;border:0;outline:none;resize:none;padding:6px 2px;min-height:34px;font-size:14px}
.cap .x{color:var(--dim);padding:6px 6px;font-size:14px}
.cap .x:hover{color:var(--text)}
.empty{color:var(--dim);font-size:13px;border:1px dashed var(--line2);border-radius:12px;padding:16px;text-align:center}

.sum{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:14px;margin-bottom:18px}
.sum dt{color:var(--mute)}
.sum dd{word-break:break-word}
.sum dd small{display:block;color:var(--dim);font-size:12px}
textarea.input{resize:vertical;min-height:84px}

.foot{display:flex;justify-content:space-between;margin-top:28px;gap:10px}

/* right side */
.rhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.rhead h3{font-size:24px;font-weight:700;letter-spacing:-.01em}
.rhead p{color:var(--mute);font-size:14px;margin-top:2px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px;margin-bottom:18px}
.stage{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#0d0d0f}
.cardfoot{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 2px;gap:10px}
.cardfoot b{font-size:15px}
.tc{font:500 13px "JetBrains Mono",monospace;color:var(--mute)}

/* scene renderer */
.sc{position:absolute;inset:0;overflow:hidden}
.sc.gray{background:radial-gradient(120% 90% at 30% 20%,#b7b7b7,#7d7d7d 55%,#5b5b5b)}
.sc.orange{background:radial-gradient(110% 90% at 70% 10%,#ffb347,#ff7a1f 45%,#e2491a 80%)}
.sc.none{background:#0d0d0f}
.sc .desk{position:absolute;left:-5%;right:-5%;bottom:0;height:var(--dh,12%);background:linear-gradient(#2a2a2e,#0e0e10);border-top-right-radius:60% 100%;opacity:.95}
.sc.orange .desk{background:linear-gradient(#3a1d10,#120805)}
.dev{position:absolute;left:var(--x);top:var(--y);width:var(--w);z-index:1}
.dev .scr{position:relative;aspect-ratio:16/10;background:#000;border:solid #111 calc(var(--w-px,1) * 1px);border-width:.45em;border-radius:.5em;overflow:hidden;box-shadow:0 1.2em 2.4em rgba(0,0,0,.35)}
.dev.monitor .stand{width:14%;height:1.6em;margin:0 auto;background:linear-gradient(90deg,#1a1a1c,#3a3a3e,#1a1a1c)}
.dev.monitor .foot2{width:34%;height:.35em;margin:0 auto;border-radius:.3em;background:#2a2a2e}
.dev.laptop .scr{aspect-ratio:16/10.4;border-radius:.6em .6em 0 0;border-bottom-width:.6em}
.dev.laptop .base{height:.7em;margin:0 -6%;background:linear-gradient(#c9c9cf,#6f6f76);border-radius:0 0 1em 1em}
.sc.none .dev .scr{border:0;border-radius:6px;box-shadow:none}
.scr video,.scr .fake{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fake{background:#f3f3f1;display:flex;flex-direction:column}
.fake .hero{height:46%;background:linear-gradient(110deg,#7c1414,#c53a1a 55%,#ff7a2e);position:relative}
.fake .hero:after{content:"";position:absolute;left:7%;top:24%;width:30%;height:9%;background:rgba(255,255,255,.85);border-radius:2px;box-shadow:0 1.6em 0 rgba(255,255,255,.7)}
.fake .rows{flex:1;padding:6% 7%;display:grid;gap:7%}
.fake .rows i{display:block;background:#dcdcd8;border-radius:2px}
.fake .rows i:nth-child(1){width:60%}
.fake .rows i:nth-child(2){width:85%}
.fake .rows i:nth-child(3){width:40%}
.ovl{position:absolute;left:5%;right:5%;display:flex;flex-direction:column;gap:.35em;pointer-events:none;z-index:4}
.ovl.top{top:15%}.ovl.center{top:50%;transform:translateY(-50%)}.ovl.bottom{bottom:8%}
.sc.space .ovl{left:58%;right:5%}.sc.space .ovl.bottom{bottom:22%}
.ci{max-width:82%;color:#fff;background:rgba(43,50,58,.86);border-radius:.3em;padding:.3em .55em;animation:in .2s;white-space:pre-wrap;word-break:break-word}
.sc.space .ci{max-width:100%;background:none;padding:0;text-shadow:0 1px 10px rgba(0,0,0,.18)}
.sc.space.gray .ci{color:#2B323A;text-shadow:none}
.ci.title{font:700 6.6cqh/1.05 Inter,Arial,sans-serif;letter-spacing:-.01em}
.ci.subtitle{font:600 4.4cqh/1.15 Inter,Arial,sans-serif}
.ci.text{font:500 3.3cqh/1.3 Inter,Arial,sans-serif}
.ci.left{align-self:flex-start;text-align:left}.ci.center{align-self:center;text-align:center}.ci.right{align-self:flex-end;text-align:right}
.ci.ghost{opacity:.55;outline:1px dashed rgba(255,255,255,.6);outline-offset:.2em}

/* timeline */
.tlwrap{margin-top:4px}
.tlbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tl{position:relative;height:58px;background:var(--field);border:1px solid var(--line2);border-radius:12px;cursor:crosshair;overflow:hidden}
.tl.ro{cursor:default}
.tl .fill{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.035) 9px 10px)}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--text);transform:translateX(-1px)}
.tl .ph:before{content:"";position:absolute;top:-1px;left:-5px;border:6px solid transparent;border-top-color:var(--text)}
.mk{position:absolute;top:10px;transform:translateX(-50%);height:38px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk b{background:var(--acc);color:#1a0d06;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;line-height:1.3}
.mk i{flex:1;width:2px;background:var(--acc)}
.mk.sel b{background:#fff}
.ticks{display:flex;justify-content:space-between;font:500 11.5px "JetBrains Mono",monospace;color:var(--dim);margin-top:6px}
.tlbtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

details.prompt summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.prompt summary::-webkit-details-marker{display:none}
details.prompt summary span{color:var(--dim);font-weight:500;font-size:13px}
details.prompt pre{margin-top:14px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:16px;font:12.5px/1.55 "JetBrains Mono",monospace;color:#cfcfd4;white-space:pre-wrap;max-height:360px;overflow:auto}

/* status */
.status{display:grid;gap:0;margin:18px 0 22px}
.st{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:18px}
.st:not(:last-child):before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.st .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:11px;background:var(--panel)}
.st.done .d{background:var(--ok);border-color:var(--ok);color:#06140d}
.st.cur .d{border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.st.cur .d:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
.st b{display:block;font-size:14.5px}
.st small{color:var(--mute);font-size:12.5px}
.st:not(.done):not(.cur) b{color:var(--dim)}

.switch{display:flex;align-items:center;gap:14px;margin-top:14px;border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;transition:.15s}
.switch:hover{border-color:#4a4a52}
.switch.on{border-color:var(--acc);background:var(--accbg)}
.switch div{flex:1}
.switch b{display:block;font-size:15px}
.switch span{color:var(--mute);font-size:13px}
.knob{width:40px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:none;transition:.15s}
.knob:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.switch.on .knob{background:var(--acc)}
.switch.on .knob:after{left:19px}
.sc{container-type:size}
.sc .blogo{position:absolute;left:4.2%;top:6.5%;height:3.7cqh;z-index:3;animation:in .25s}
.sc .blogo img{display:block;height:100%;width:auto}
.sc .age{position:absolute;right:4.2%;top:6.5%;height:3.7cqh;display:flex;align-items:center;font:600 5.1cqh/1 Inter,Arial,sans-serif;letter-spacing:-.01em;color:#fff;opacity:.6;z-index:3;animation:in .25s}
.sc.gray .age{color:#2B323A}
.switch+.switch{margin-top:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1e1e22;border:1px solid var(--line2);border-radius:12px;padding:12px 18px;font-size:14px;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.banner{flex-direction:column;align-items:stretch}.wrap{padding:0 20px 60px}}

/* ===== DDoS priglos ===== */
.seg.three{grid-template-columns:1fr 1.15fr .85fr}
.seg.three button{padding:11px 4px;white-space:nowrap}
.seg.three small{display:none}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cnt{float:right;font-weight:500;font-size:12px;color:var(--dim)}
.cnt.over{color:var(--acc2)}
.pv{position:relative;margin:0 auto;border-radius:12px;overflow:hidden;background:#2B323A;container-type:size;color:#fff}
.pv.f16_9{aspect-ratio:16/9;width:100%}
.pv.f1_1{aspect-ratio:1/1;height:min(560px,60vw)}

<script>
let MODE="screencast";
/* ====== НАСТРОЙКИ ====== */
const CONFIG = {

let playingTrack=null, audioCtx=null, audioNodes=[];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => { if(t==null) return "—"; t=Math.max(0,t); const m=Math.floor(t/60), s=(t%60); return m+":"+(s<10?"0":"")+s.toFixed(1); };
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }
const live = () => !!(CONFIG.WORKER_URL && S.key);
const dur = () => S.source?.duration || 0;
const needMusic = () => S.sound==="music" || S.sound==="voice_music";
const skipCaps = () => S.titles===false;
function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }

function sceneHTML(id, {mini=false, withVideo=false, captions=""}={}){
  const sc = SCENES.find(s=>s.id===id) || {bg:"none",dev:"flat",x:6,y:6,w:88};
  const screen = withVideo && S.source?.src
    ? `<video id="pv" src="${esc(S.source.src)}" muted playsinline preload="metadata"></video>`
    : `<div class="fake"><div class="hero"></div><div class="rows"><i></i><i></i><i></i></div></div>`;
  let dev;
  if(sc.dev==="flat") dev = `<div class="dev" style="--x:0%;--y:0%;--w:100%;height:100%"><div class="scr" style="aspect-ratio:auto;height:100%">${screen}</div></div>`;
  else if(sc.dev==="laptop") dev = `<div class="dev laptop" style="--x:${sc.x}%;--y:${sc.y}%;--w:${sc.w}%"><div class="scr">${screen}</div><div class="base"></div></div>`;
  else dev = `<div class="dev monitor" style="--x:${sc.x}%;--y:${sc.y}%;--w:${sc.w}%"><div class="scr">${screen}</div><div class="stand"></div><div class="foot2"></div></div>`;
  const fs = mini ? "font-size:5px" : "font-size:clamp(7px,1.1vw,14px)";
  return `<div class="sc ${sc.bg} ${sc.space?'space':''}" style="${fs}">
    ${sc.dh?`<div class="desk" style="--dh:${sc.dh}"></div>`:""}${dev}
    ${!mini && S.logo?`<div class="blogo"><img alt="Solar" src="${sc.bg==='gray'?LOGO.color:LOGO.white}"></div>`:""}
    ${!mini && S.age?`<div class="age">18+</div>`:""}
    ${captions}</div>`;
}

/* ---------- steps ---------- */
function renderBars(){
  $("#bars").style.gridTemplateColumns="";
  $("#bars").innerHTML = STEPS.map((n,i)=>{
    let c = i===S.step?"cur": (i===4&&skipCaps()?"skip": i<S.step?"done":"");
    return `<button class="${c}" title="${n}${i===4&&skipCaps()?' — не нужно':''}" data-go="${i}"></button>`;
  }).join("");
  $("#bars").querySelectorAll("button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.go; if(i<S.step && !(i===4&&skipCaps())) go(i); });
}

function stepHead(){
  const label = STEPS[S.step];
  return `<div class="stephead"><span class="n">${S.step+1}</span>${label}<span class="of">шаг ${S.step+1} из 6</span></div>`;
}

const VIEWS = [

() => `${stepHead()}
  <h2>Запись экрана</h2>
  <p class="lead">Вставьте ссылку на Яндекс Диск или выберите файл. Нужна запись такой, какой её сохранила программа: без монтажа и пережатия.</p>
  <label class="f">Ссылка на Яндекс Диск</label>
  <input class="input" id="urlIn" placeholder="https://disk.yandex.ru/i/…" value="${S.source?.kind==='link'?esc(S.source.url):''}">

  <div class="or">или</div>
  <div class="drop" id="drop"><b>Выбрать файл записи</b><span>с файлом можно отметить места титров прямо на видео</span></div>

  <p class="hint" style="margin-top:18px">Нет записи под рукой? <span class="link" id="demoSrc">Попробовать на примере</span></p>`,

/* 1 — Звук */
() => `${stepHead()}
  <h2>Звук</h2><p class="lead">Что сделать со звуком записи?</p>
  <div class="opts">${SOUNDS.map(o=>`<button class="opt ${S.sound===o.id?'on':''}" data-sound="${o.id}">${o.tag?`<span class="tag">${o.tag}</span>`:""}<b>${o.name}</b><span>${o.desc}</span></button>`).join("")}</div>
  ${needMusic()?`<div class="music"><h4>Фоновый трек</h4><div class="tracks">${TRACKS.map(t=>`
    <button class="track ${S.track===t.id?'on':''} ${playingTrack===t.id?'playing':''}" data-track="${t.id}">

    ${S.sound==='voice_music'?'<p class="hint">Музыку приглушим под голос (ducking), в паузах она станет громче.</p>':'<p class="hint">Нажмите ▶, чтобы послушать. Финальный трек — из библиотеки студии.</p>'}</div>`:""}`,

function waveBars(id){ let seed=id.length*7, out=""; for(let i=0;i<28;i++){ seed=(seed*9301+49297)%233280; const h=25+Math.round(seed/233280*75); out+=`<i style="height:${h}%;animation-delay:${(i%7)*.08}s"></i>`; } return out; }
function soundLabel(){ const s=SOUNDS.find(o=>o.id===S.sound); if(!s) return "—"; const t=TRACKS.find(x=>x.id===S.track); return s.name + (needMusic()&&t?` · трек «${t.name}»`:""); }

function canNext(){
  switch(S.step){
    case 0: return !!S.source && dur()>0;
    case 1: return !!S.sound && (!needMusic() || !!S.track);
    case 2: return S.titles!==null;
    case 3: return !!S.scene;
    case 4: return S.caps.length>0 && S.caps.every(c=>c.text.trim());
    case 5: return !!S.contact.trim();
  }
}

function go(i){
  stopTrack();
  if(i===4 && skipCaps()) i = i>S.step ? 5 : 3;
  S.step = Math.max(0,Math.min(5,i));
  render();
}

function render(){
  if(MODE==="priglos") return pRender();
  if(MODE==="tv") return tRender();
  if(S.sent) return renderSent();
  renderBars();
  $("#stepBody").innerHTML = VIEWS[S.step]();
  $("#back").style.visibility = S.step===0?"hidden":"visible";
  $("#next").textContent = S.step===5 ? (live()?"Отправить в работу":"Отправить (демо)") : "Дальше";
  $("#next").disabled = !canNext();
  $("#rsub").textContent = `Шаг ${S.step+1} из 6 · ${STEPS[S.step]}`;
  bindStep();
  renderStage(); renderTimeline(); renderPrompt();
}

function bindStep(){
  const body=$("#stepBody");
  // step 0
  const url=$("#urlIn");
  if(url) url.oninput = () => {
    const v=url.value.trim();
    if(/^https?:\/\/(disk\.yandex\.(ru|com)|yadi\.sk)\//.test(v)){
      if(S.source?.kind!=='link' || S.source.url!==v){ setLink(v); }
    } else if(S.source?.kind==='link'){ S.source=null; refreshKeepFocus("#urlIn"); }
  };
  const d=$("#durIn"); if(d) d.oninput=()=>{ S.source.duration=parseFloat(d.value)||0; $("#next").disabled=!canNext(); renderTimeline(); renderPrompt(); };
  const drop=$("#drop");
  if(drop){
    drop.onclick=()=>$("#fileIn").click();
    drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
    drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over"); if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);};
  }
  $("#demoSrc")?.addEventListener("click",()=>{ S.source={kind:"demo",name:"Пример — demo_screen.mp4",url:"",duration:CONFIG.DEMO_DURATION}; S.t=0; render(); });
  $("#clrSrc")?.addEventListener("click",()=>{ S.source=null; S.caps=[]; render(); });
  // step 1
  body.querySelectorAll("[data-sound]").forEach(b=>b.onclick=()=>{ S.sound=b.dataset.sound; if(!needMusic()){S.track=null;stopTrack();} render(); });
  body.querySelectorAll("[data-track]").forEach(b=>b.onclick=e=>{
    const id=b.dataset.track; S.track=id;
    if(e.target.closest("[data-play]") || playingTrack!==id) toggleTrack(id); render();
  });
  // step 2
  body.querySelectorAll("[data-titles]").forEach(b=>b.onclick=()=>{ S.titles=b.dataset.titles==="1"; render(); });
  // step 3
  body.querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{ S.scene=b.dataset.scene; render(); });
  $("#logoSw")?.addEventListener("click",()=>{ S.logo=!S.logo; render(); });
  $("#ageSw")?.addEventListener("click",()=>{ S.age=!S.age; render(); });
  // step 4
  body.querySelectorAll("[data-cap]").forEach(t=>{
    autosize(t);
    t.oninput=()=>{ S.caps[+t.dataset.cap].text=t.value; lastCapKey=null; autosize(t); $("#next").disabled=!canNext(); renderPrompt(); renderStage(true); };
    t.onfocus=()=>{ S.sel=+t.dataset.cap; markSel(); const c=S.caps[S.sel]; if(c.t!=null) seek(c.t); };
  });
  body.querySelectorAll("[data-seek]").forEach(b=>b.onclick=()=>{ const c=S.caps[+b.dataset.seek]; if(c.t!=null) seek(c.t); });
  body.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const [i,k,v]=b.dataset.opt.split(":"); const c=S.caps[+i]; c[k]=v; S.sel=+i;
    if(c.t!=null) S.t=c.t; lastCapKey=null; render();
  });
  body.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.caps.splice(+b.dataset.del,1); S.sel=null; render(); });
  // step 5
  const ci=$("#contactIn"); if(ci) ci.oninput=()=>{ S.contact=ci.value; store("ms_contact",ci.value); $("#next").disabled=!canNext(); renderPrompt(); };
  const ni=$("#notesIn"); if(ni) ni.oninput=()=>{ S.notes=ni.value; renderPrompt(); };
}
function refreshKeepFocus(sel){ const el=$(sel), pos=el?.selectionStart; render(); const n=$(sel); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} } }
function autosize(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
function markSel(){ document.querySelectorAll(".cap").forEach((c,i)=>c.classList.toggle("sel",i===S.sel)); renderTimeline(); }

/* ---------- source ---------- */
function setFile(f){
  if(!f.type.startsWith("video/")) return toast("Нужен видеофайл");
  const src=URL.createObjectURL(f);
  S.source={kind:"file",name:f.name,file:f,src,duration:0,size:f.size};
  const v=document.createElement("video"); v.preload="metadata"; v.src=src;
  v.onloadedmetadata=()=>{ S.source.duration=Math.round(v.duration*10)/10; render(); };
  v.onerror=()=>{ toast("Браузер не открыл файл — укажите длительность вручную"); };
  S.caps=[]; S.t=0; render();
}
$("#fileIn").onchange=e=>{ if(e.target.files[0]) setFile(e.target.files[0]); e.target.value=""; };

async function setLink(url){
  const name = decodeURIComponent(url.split("/").pop()||"запись");
  S.source={kind:"link",name:"Яндекс Диск · "+name,url,duration:0};
  S.caps=[]; S.t=0;
  if(CONFIG.WORKER_URL){
    try{
      const r=await fetch(`${CONFIG.WORKER_URL}/yadisk?url=${encodeURIComponent(url)}`,{headers:{"X-Access-Key":S.key}});
      const j=await r.json();
      if(j.href){
        S.source.name=j.name||S.source.name; S.source.src=j.href;
        const v=document.createElement("video"); v.preload="metadata"; v.src=j.href;
        v.onloadedmetadata=()=>{ S.source.duration=Math.round(v.duration*10)/10; refreshKeepFocus("#urlIn"); };
      }
    }catch(e){ /* покажем поле длительности */ }
  }
  refreshKeepFocus("#urlIn");
}

/* ---------- preview stage ---------- */
const ROLE_ORDER = {title:0, subtitle:1, text:2};
function capMeta(c){ return `${nameOf(ROLES,c.role)} · ${nameOf(VPOS,c.v).toLowerCase()} · ${nameOf(ALIGN,c.align).toLowerCase()}`; }
function activeCaps(){
  if(!S.titles) return [];
  const on = S.caps.map((c,i)=>({...c,i})).filter(c=>c.text.trim() && c.t!=null && S.t>=c.t && S.t<c.t+3);
  // на шаге титров выбранный титр видно всегда — чтобы проверить стиль, даже если он «без места»
  if(S.step===4 && S.sel!=null && S.caps[S.sel] && !on.some(c=>c.i===S.sel)) on.push({...S.caps[S.sel], i:S.sel, ghost:true});
  return on;
}
function captionsHTML(){
  const groups={top:[],center:[],bottom:[]};
  activeCaps().forEach(c=>groups[c.v||"bottom"].push(c));
  return Object.entries(groups).filter(([,a])=>a.length).map(([v,a])=>
    `<div class="ovl ${v}">${a.sort((x,y)=>ROLE_ORDER[x.role]-ROLE_ORDER[y.role]||(x.t??1e9)-(y.t??1e9))
      .map(c=>`<div class="ci ${c.role} ${c.align}${c.ghost?' ghost':''}">${esc(c.text.trim()||nameOf(ROLES,c.role))}</div>`).join("")}</div>`).join("");
}
let lastCapKey=null;
function renderStage(onlyCaption){
  const stage=$("#stage");
  if(onlyCaption){
    const html=captionsHTML(); if(html===lastCapKey) return; lastCapKey=html;
    stage.querySelectorAll(".ovl").forEach(o=>o.remove());
    stage.querySelector(".sc")?.insertAdjacentHTML("beforeend",html); return; }
  const sceneId = S.scene || (S.step>=3?null:"none");
  lastCapKey=captionsHTML(); stage.innerHTML = sceneHTML(sceneId||"none",{withVideo:true,captions:lastCapKey});
  $("#sceneName").textContent = S.scene ? SCENES.find(s=>s.id===S.scene).name : "Сцена не выбрана";
  const v=$("#pv");
  if(v){ v.currentTime=S.t; v.ontimeupdate=()=>{ S.t=v.currentTime; tick(); }; v.onended=()=>setPlay(false); }
  tick();
}
let playing=false, raf=null, last=0;
function setPlay(on){
  playing=on && dur()>0; $("#playBtn").textContent=playing?"❚❚ Пауза":"▶ Пуск";
  const v=$("#pv");
  if(v){ playing? v.play().catch(()=>{}) : v.pause(); return; }
  cancelAnimationFrame(raf);
  if(playing){ last=performance.now(); const loop=n=>{ S.t+= (n-last)/1000; last=n; if(S.t>=dur()){S.t=dur();setPlay(false);} tick(); if(playing) raf=requestAnimationFrame(loop); }; raf=requestAnimationFrame(loop); }
}
$("#playBtn").onclick=()=>{ if(S.t>=dur()) S.t=0; setPlay(!playing); };
function seek(t){ S.t=Math.max(0,Math.min(dur(),t)); const v=$("#pv"); if(v) v.currentTime=S.t; tick(); }
function tick(){
  $("#tc").textContent = `${fmt(S.t)} / ${fmt(dur())}`;
  const ph=$("#ph"); if(ph && dur()) ph.style.left=(S.t/dur()*100)+"%";
  const ah=$("#addHere"); if(ah) ah.textContent=`＋ Титр в этом месте · ${fmt(S.t)}`;
  renderStage(true);
}

/* ---------- timeline ---------- */
function renderTimeline(){
  const show = S.titles===true && dur()>0 && (S.step>=4);
  $("#tlCard").classList.toggle("hidden",!show);
  if(!show) return;
  const edit = S.step===4;
  $("#tl").classList.toggle("ro",!edit);
  $("#tlBtns").classList.toggle("hidden",!edit);
  const d=dur();
  $("#ticks").innerHTML=[0,.25,.5,.75,1].map(k=>`<span>${fmt(d*k)}</span>`).join("");
  $("#tlInfo").textContent = `${S.caps.length} ${plural(S.caps.length,"титр","титра","титров")}${S.caps.some(c=>c.t==null)?' · часть без места':''}`;
  const tl=$("#tl"); tl.querySelectorAll(".mk").forEach(m=>m.remove());
  S.caps.forEach((c,i)=>{ if(c.t==null) return;
    const m=document.createElement("div"); m.className="mk"+(S.sel===i?" sel":""); m.style.left=(c.t/d*100)+"%";
    m.innerHTML=`<b>${i+1}</b><i></i>`; m.onclick=e=>{ e.stopPropagation(); seek(c.t); if(edit){ S.sel=i; document.querySelector(`[data-cap="${i}"]`)?.focus(); } };
    tl.appendChild(m); });
  tick();
}
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
$("#tl").onclick=e=>{ if(S.step!==4) return; const r=e.currentTarget.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*dur()); };
$("#addHere").onclick=()=>addCap(Math.round(S.t*10)/10);
$("#addFree").onclick=()=>addCap(null);
function addCap(t){
  const sp = SCENES.find(s=>s.id===S.scene)?.space;
  const prev = S.caps[S.caps.length-1];
  S.caps.push({t, text:"", role: S.caps.length? "text":"title",
    v: prev?.v || (sp?"top":"bottom"), align: prev?.align || (sp?"left":"center")});
  S.caps.sort((a,b)=>(a.t??1e9)-(b.t??1e9));
  const i=S.caps.findIndex(c=>c.text===""&&c.t===t); S.sel=i; render();
  document.querySelector(`[data-cap="${i}"]`)?.focus();
}

/* ---------- music preview (WebAudio) ---------- */
function toggleTrack(id){ if(playingTrack===id) return stopTrack(); stopTrack(); playTrack(id); }
function stopTrack(){ audioNodes.forEach(n=>{try{n.stop()}catch(e){}}); audioNodes=[]; if(playingTrack){ playingTrack=null; document.querySelectorAll(".track.playing").forEach(t=>{t.classList.remove("playing"); t.querySelector(".play").textContent="▶";}); } }
function playTrack(id){
  const tr=TRACKS.find(t=>t.id===id); audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const ctx=audioCtx, now=ctx.currentTime, beat=60/tr.bpm, master=ctx.createGain(); master.gain.value=.08; master.connect(ctx.destination);
  const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value= tr.wave==="sawtooth"||tr.wave==="square" ? 1400 : 3000; lp.connect(master);
  for(let i=0;i<24;i++){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=tr.wave;
    o.frequency.value = tr.notes[(i*(id==="calm"?1:3))%tr.notes.length];
    const st=now+i*beat/2, len = id==="calm"?beat*2:beat*.45;
    g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(id==="minimal"?.5:1,st+.02); g.gain.exponentialRampToValueAtTime(.001,st+len);
    o.connect(g); g.connect(lp); o.start(st); o.stop(st+len+.05); audioNodes.push(o);
  }
  const pad=ctx.createOscillator(), pg=ctx.createGain(); pad.type="sine"; pad.frequency.value=tr.notes[0]/2; pg.gain.value=.5; pad.connect(pg); pg.connect(lp); pad.start(now); pad.stop(now+12*beat); audioNodes.push(pad);
  playingTrack=id; setTimeout(()=>{ if(playingTrack===id){ stopTrack(); } }, 12*beat*1000);
}

/* ---------- payload & prompt ---------- */
function payload(){
  return {
    type:"screencast", version:1,
    source:{kind:S.source?.kind, name:S.source?.name, url:S.source?.url||null, upload:S.source?.upload||null, duration:dur()},
    sound:{mode:S.sound, track: needMusic()?S.track:null},
    scene:S.scene,
    logo:{enabled:S.logo, brand:"solar", position:"top-left"},
    age_mark:{enabled:S.age, text:"18+", position:"top-right", opacity:0.6},
    titles:{enabled:!!S.titles, items:S.titles? S.caps.map(c=>({t:c.t, text:c.text.trim(), role:c.role, v:c.v, align:c.align})):[]},
    contact:S.contact.trim(), notes:S.notes.trim(), kaiten:S.kaiten||null
  };
}
function buildPrompt(){
  const p=payload(), sc=SCENES.find(s=>s.id===p.scene), tr=TRACKS.find(t=>t.id===p.sound.track);
  const L=[];
  L.push("Задача: скринкаст для Motion Studio. Работай по agent/CLAUDE.md и agent/skills/screencast/SKILL.md.");
  L.push("");
  L.push("Исходник: " + (p.source.kind==="file"?`загружен в хранилище → work/source (${p.source.name})`: p.source.kind==="link"?`Яндекс Диск ${p.source.url} → скачай в work/source`:"пример assets/demo/demo_screen.mp4") + `, длительность ${fmt(p.source.duration)}.`);
  L.push("Звук: " + ({voice:"оставить голос из записи, нормализовать до −16 LUFS, убрать шум и щелчки.",mute:"звук записи убрать полностью.",music:`звук записи убрать, поставить трек assets/music/${p.sound.track}.mp3 («${tr?.name||"—"}»), fade-in 1 с, fade-out 2 с.`,voice_music:`оставить голос (−16 LUFS) и подложить assets/music/${p.sound.track}.mp3 («${tr?.name||"—"}») с ducking: под голосом −18 dB, в паузах −10 dB.`}[p.sound.mode]||"—"));
  L.push("Сцена: " + (p.scene==="none"?"без мокапа — запись на весь кадр 1920×1080, поля по 0.":`мокап assets/mockups/${p.scene}/ («${sc?.name}»): вставь запись в экран по corner-pin из mockup.json.`) + (sc?.space?" Титры — в свободной зоне справа от устройства.":""));
  L.push("Логотип: " + (p.logo.enabled ? "Солар в левом верхнем углу по гайду — assets/brand.json → logo (отступы, высота, версия под фон: белый на оранжевом и тёмном, оранжевый на светлом). Виден весь ролик, появление 0.4 с." : "не нужен."));
  L.push("Маркировка 18+: " + (p.age_mark.enabled ? "надпись «18+» в правом верхнем углу, те же отступы и высота, что у логотипа, прозрачность 60%, весь ролик — assets/brand.json → age_mark." : "не нужна."));
  if(p.titles.enabled){
    L.push("Титры (дословно, ~3 с каждый, появление/уход 0.3 с; стиль по типу — assets/brand.json → titles.roles; положение: верх/центр/низ зоны титров, выравнивание — как указано; титры с общим временем и положением — стопкой: заголовок → подзаголовок → текст):");

  L.push("Если что-то неясно — не выдумывай: опиши вопрос в out/QUESTION.md и заверши работу.");
  return L.join("\n");
}
function renderPrompt(){ $("#promptPre").textContent = buildPrompt() + "\n\n--- JSON заявки ---\n" + JSON.stringify(payload(),null,2); }
$("#copyPrompt").onclick=()=>{ navigator.clipboard?.writeText(buildPrompt()).then(()=>toast("Промт скопирован"),()=>toast("Не удалось скопировать")); };

/* ---------- submit ---------- */
$("#back").onclick=()=>MODE==="priglos"?pGo(P.step-1):MODE==="tv"?tGo(T.step-1):go(S.step-1);
const nextHandler=async()=>{
  if(MODE==="priglos") return pNext();
  if(MODE==="tv") return tNext();
  if(!canNext()) return;
  if(S.step<5) return go(S.step+1);
  const btn=$("#next"); btn.disabled=true;
  if(!live()){ btn.textContent="Отправляем…"; await new Promise(r=>setTimeout(r,700)); S.sent={id:Math.floor(100+Math.random()*900), demo:true, state:"queued", issue:null, download:null}; renderSent(); demoProgress(); return; }
  try{
    if(S.source.kind==="file"){
      btn.textContent="Загружаем запись…";
      const r=await api("/upload-url",{name:S.source.name,size:S.source.size,type:S.source.file.type});
      await putWithProgress(r.put, S.source.file, pct=>btn.textContent=`Загружаем запись… ${pct}%`);
      S.source.upload=r.key;
    }
    btn.textContent="Создаём задачу…";
    const j=await api("/submit",{payload:payload(), prompt:buildPrompt()});
    S.sent={id:j.id, state:"queued", issue:j.issue_url, download:null}; renderSent(); poll();
  }catch(e){ btn.disabled=false; btn.textContent="Отправить в работу"; toast("Ошибка: "+e.message); }
};
$("#next").onclick=nextHandler;
async function api(path,body){
  const r=await fetch(CONFIG.WORKER_URL+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Access-Key":S.key},body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error((await r.text())||r.status); return r.json();
}
function putWithProgress(url,file,cb){ return new Promise((ok,fail)=>{ const x=new XMLHttpRequest(); x.open("PUT",url); x.setRequestHeader("Content-Type",file.type||"video/mp4"); x.upload.onprogress=e=>e.lengthComputable&&cb(Math.round(e.loaded/e.total*100)); x.onload=()=>x.status<300?ok():fail(new Error("upload "+x.status)); x.onerror=()=>fail(new Error("сеть")); x.send(file); }); }
async function poll(){ if(!S.sent||S.sent.demo) return; try{ const j=await api("/status/"+S.sent.id); Object.assign(S.sent,{state:j.state,download:j.download_url,issue:j.issue_url||S.sent.issue,question:j.question}); renderSent(); }catch(e){} if(S.sent && !["done","error"].includes(S.sent.state)) setTimeout(poll,15000); }
function demoProgress(){ const seq=["working","render","done"]; let i=0; const t=setInterval(()=>{ if(!S.sent){clearInterval(t);return;} S.sent.state=seq[i++]; renderSent(); if(i>=seq.length) clearInterval(t); },2600); }

const STATES=[
  {id:"queued", name:"Заявка создана", desc:"Задача в GitHub, ждёт агента"},
  {id:"working",name:"Агент в работе", desc:"Claude собирает сцену, звук и титры"},
  {id:"render", name:"Рендер и проверка", desc:"Сборка MP4, контрольный кадр"},
  {id:"done",   name:"Готово", desc:"Ролик можно скачать"}
];
function renderSent(){
  const s=S.sent, idx=Math.max(0,STATES.findIndex(x=>x.id===s.state));
  $("#bars").innerHTML=STEPS.map(()=>`<button class="done"></button>`).join("");
  $("#stepBody").innerHTML = `<div class="stephead"><span class="n">✓</span>Заявка #${s.id}${s.demo?'<span class="of">демо</span>':''}</div>
    <h2>${s.state==="done"?"Ролик готов":s.state==="error"?"Нужна помощь":"Заявка в работе"}</h2>
    <p class="lead">${s.demo?"Это демо: задача не создана, статусы сменятся сами.":"Страницу можно закрыть — статус и ссылка на ролик сохранятся в задаче на GitHub."}</p>
    <div class="status">${STATES.map((x,i)=>`<div class="st ${s.state==="done"||i<idx?"done":i===idx?"cur":""}"><div class="d">${s.state==="done"||i<idx?"✓":""}</div><div><b>${x.name}</b><small>${x.desc}</small></div></div>`).join("")}</div>
    ${s.question?`<p class="hint" style="color:var(--acc2)">Агент задал вопрос: ${esc(s.question)} — ответьте в задаче.</p>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn acc" ${s.state==="done"&&s.download?`href="${esc(s.download)}"`:""} style="text-decoration:none;${s.state==="done"?"":"opacity:.35;pointer-events:none"}" ${s.demo?'onclick="toast(\'В демо файла нет\');return false"':''}>⬇ Скачать MP4</a>
      ${s.issue?`<a class="btn" href="${esc(s.issue)}" target="_blank" style="text-decoration:none">Задача на GitHub ↗</a>`:""}
    </div>`;
  $("#back").style.visibility="hidden";
  $("#next").disabled=false; $("#next").textContent="Новая заявка";
  $("#next").onclick=()=>location.reload();
}

function pBind(){

function pBindTL(){
  const tl=$("#ptl"); let drag=null;
  const tAt=e=>{ const r=tl.getBoundingClientRect(); return Math.max(0,Math.min(pDur(),(e.clientX-r.left)/r.width*pDomain())); };
  tl.onpointerdown=e=>{ pStop(); const h=e.target.closest("[data-h]"); drag=h?h.dataset.h:"seek"; tl.setPointerCapture(e.pointerId); move(e); };
  tl.onpointermove=e=>{ if(drag) move(e); };
  tl.onpointerup=()=>{ if(drag && drag!=="seek") render(); drag=null; };
  function move(e){ const t=Math.round(tAt(e)*100)/100;
    if(drag==="in"){ P.tin=Math.min(t,P.tout-1); P.t=P.tin; }
    else if(drag==="out"){ P.tout=Math.max(t,P.tin+1); P.t=Math.max(P.tin,P.tout-1.5); }
    else { P.t=t; P.logoT=null; }
    pSeekVideo(); pDrawTL(); pTick();
    if(drag!=="seek"){ const st=$("#stepBody"); const ti=$("#pTin"), to=$("#pTout"); if(ti) ti.value=fmt(P.tin); if(to) to.value=fmt(P.tout); }
  }
}

  const ph=$("#pph"); if(ph){ const T=inLogo? P.tout+P.logoT : P.t; ph.style.left=(T/pDomain()*100)+"%"; }
  const mk=$("#pMark"); if(mk){

function pPlay(){

  $("#stepBody").innerHTML=`<div class="stephead"><span class="n">✓</span>Заявка #${P.sent.id}</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn acc" id="pDl2">⬇ JSON ещё раз</button>${P.sent.issue?`<a class="btn" href="${esc(P.sent.issue)}" target="_blank" style="text-decoration:none">Задача на GitHub ↗</a>`:""}</div>`;
  $("#pDl2").onclick=pDownload; $("#back").style.visibility="hidden";
  $("#next").textContent="Новая заявка"; $("#next").disabled=false; $("#next").onclick=()=>location.reload();
}

/* ---- вкладки ---- */
document.querySelectorAll(".seg [data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
if(location.hash==="#priglos") setMode("priglos");
</script>
<script>
/* ====================== Ролик на ТВ в офис ====================== */
// Сцена = слайд презентации. Структура: титул → «Что делает продукт» (4 карточки) → «Преимущества» (экраны по 2 карточки).
const T_STEPS = ["Титул","Что делает продукт","Преимущества","Тайминг","Отправка"];
const T_LIM = { product:30, desc:300, head:40, sub:110, fTitle:50, fText:110, aTitle:75, aText:300 };
const T_DUR = { title:7, features:14, adv:10 };          // секунды по умолчанию
const newCard = () => ({ title:"", text:"" });
const T = {
  step:0, product:"", desc:"",
  feat:{ head:"Что делает продукт", sub:"", cards:[newCard(),newCard(),newCard(),newCard()] },
  adv:{ head:"", sub:"", pairs:[[newCard(),newCard()],[newCard(),newCard()]] },
  dur:{}, view:0, notes:"", sent:null, imported:null
};
// пример — тексты из презентации Solar AI Firewall
const T_EXAMPLE = {
  product:"Solar AI Firewall",
  desc:"Специализированный шлюз безопасности для контроля взаимодействия сотрудников и приложений с внешними и внутренними ИИ-моделями. Проверяет запросы до отправки модели и ответы до выдачи пользователю, чтобы противодействовать атакам на ИИ и предотвращать раскрытие конфиденциальных данных.",
  feat:{ head:"Что делает продукт", sub:"Проверяет запросы и ответы, включая переданные модели документы и историю диалога", cards:[
    {title:"Защищает данные от раскрытия", text:"Маскирует конфиденциальные данные в запросах и ответах или блокирует их передачу по правилам компании."},
    {title:"Противодействует атакам на ИИ", text:"Выявляет попытки заставить ИИ нарушить заданные правила или раскрыть защищённую информацию."},
    {title:"Контролирует использование и затраты на ИИ", text:"Управляет доступом к моделям и ограничивает использование и расходы по сотрудникам и командам"},
    {title:"Помогает расследовать инциденты и проводить аудит", text:"Показывает, кто обращался к ИИ, какая проверка сработала и какое действие применила защита."}]},
  adv:{ head:"Преимущества Solar AI Firewall", sub:"Технологии защиты и экспертиза ГК «Солар»", pairs:[
    [{title:"Полный цикл защиты при работе с ИИ — с ответственностью крупного ИБ-вендора", text:"Solar AI Firewall объединяет защиту данных и противодействие атакам — от запроса до ответа. За продуктом стоит ГК «Солар» — крупный ИБ-вендор с опытом защиты крупнейших организаций и ресурсами для разработки, внедрения, поддержки и развития решения с учётом новых угроз и задач бизнеса."},
     {title:"Непрерывное совершенствование выявления атак на ИИ", text:"Защита развивается вместе с угрозами: лаборатория атак исследует способы обхода, а обучение и дообучение защитных моделей помогают совершенствовать обнаружение атак."}],
    [{title:"Экосистема ГК «Солар» для безопасной работы с ИИ", text:"Solar webProxy контролирует доступ к ИИ-сервисам, Solar Dozor защищает корпоративные данные, а Solar AI Firewall проверяет запросы и ответы моделей. Вместе они обеспечивают комплексную защиту на разных этапах работы с ИИ."},
     {title:"Многоуровневый анализ запросов, контекста и ответов", text:"Правила и анализ смысла работают совместно, помогая распознавать скрытые вредоносные инструкции и атаки, распределённые по нескольким сообщениям."}]]}
};
const nn = i => String(i+1).padStart(2,"0");

/* ---- сцены ---- */
function tScenes(){
  const S=[{id:"S01_TITLE", kind:"title", name:"Титул"}, {id:"S02_FEATURES", kind:"features", name:"Что делает продукт"}];
  T.adv.pairs.forEach((p,i)=>S.push({id:`S${nn(i+2)}_ADV_${nn(i)}`.replace(/^S(\d)_/,"S0$1_"), kind:"advantages", name:`Преимущества ${nn(i*2)}–${nn(i*2+1)}`, pair:i}));
  S.forEach((s,i)=>{ s.id=`S${nn(i)}_${s.kind==="title"?"TITLE":s.kind==="features"?"FEATURES":"ADV_"+nn(s.pair)}`; s.dur = T.dur[s.id] ?? T_DUR[s.kind==="advantages"?"adv":s.kind]; });
  return S;
}
const tTotal = () => tScenes().reduce((a,s)=>a+s.dur,0);

/* ---- проверки ---- */
const tLen = (v,max,min=1) => { const n=String(v||"").trim().length; return !n?"empty":n<min?"short":n>max?"long":"ok"; };
function tStepOk(i){
  const f=T.feat, a=T.adv;
  switch(i){
    case 0: return tLen(T.product,T_LIM.product)==="ok" && tLen(T.desc,T_LIM.desc)==="ok";
    case 1: return tLen(f.head,T_LIM.head)==="ok" && f.cards.every(c=>tLen(c.title,T_LIM.fTitle)==="ok" && tLen(c.text,T_LIM.fText)==="ok");
    case 2: return tLen(a.head,T_LIM.head)==="ok" && a.pairs.length>0 && a.pairs.every(p=>p.every(c=>tLen(c.title,T_LIM.aTitle)==="ok" && tLen(c.text,T_LIM.aText)==="ok"));
    case 3: return tScenes().every(s=>s.dur>=2 && s.dur<=60);
    case 4: return !!S.contact.trim();
  }
}
function tCan(){ return tStepOk(T.step) && !(T.step<=2 && tOverflow().length); }
function tGo(i){ T.step=Math.max(0,Math.min(T_STEPS.length-1,i)); const sc=tScenes(); T.view = T.step===0?0 : T.step===1?1 : T.step===2?Math.max(2,Math.min(T.view,sc.length-1)) : T.view; render(); }

/* ---- поля ---- */
function tField(path,label,max,{ta=false,rows=2,ph=""}={}){
  const v=tGet(path), st=tLen(v,max), n=String(v).length;
  return `<label class="f">${label}<span class="cnt ${st==="long"?'over':''}" data-tcnt="${path}">${n} / ${max}</span></label>
    ${ta?`<textarea class="input" rows="${rows}" style="min-height:0" maxlength="${max}" data-tf="${path}" placeholder="${esc(ph)}">${esc(v)}</textarea>`
        :`<input class="input" maxlength="${max}" data-tf="${path}" placeholder="${esc(ph)}" value="${esc(v)}">`}`;
}
function tGet(path){ return path.split(".").reduce((o,k)=>o?.[k],T) ?? ""; }
function tSet(path,v){ const ks=path.split("."), last=ks.pop(); ks.reduce((o,k)=>o[k],T)[last]=v; }

const T_VIEWS = [
/* 0 — титул */
() => `<h2>Титульная сцена</h2>
  <p class="lead">Каждая сцена ролика — слайд презентации. Можно заполнить вручную или загрузить презентацию, поля подставятся сами.</p>
  <div class="drop" id="tPptx" style="padding:18px 16px"><b>Загрузить презентацию .pptx</b><span>${T.imported?esc(T.imported):'тексты разложатся по сценам — проверьте и поправьте'}</span></div>
  ${tField("product","Название продукта",T_LIM.product,{ph:"Solar AI Firewall"})}
  ${tField("desc","Описание",T_LIM.desc,{ta:true,rows:5,ph:"Специализированный шлюз безопасности для…"})}
  <p class="hint" style="margin-top:14px"><span class="link" id="tDemo">Заполнить примером (Solar AI Firewall)</span></p>
  <div id="tFit" class="hidden"></div>`,

/* 1 — что делает продукт */
() => `<h2>Что делает продукт</h2>
  <p class="lead">Одна сцена: заголовок, подзаголовок и 4 карточки — 2×2, как на слайде.</p>
  ${tField("feat.head","Заголовок",T_LIM.head)}
  ${tField("feat.sub","Подзаголовок",T_LIM.sub,{ta:true})}
  ${T.feat.cards.map((c,i)=>`<div class="tcard"><div class="tcard-h"><b>${nn(i)}</b>Карточка ${i+1}</div>
    ${tField(`feat.cards.${i}.title`,"Заголовок",T_LIM.fTitle,{ta:true})}
    ${tField(`feat.cards.${i}.text`,"Текст",T_LIM.fText,{ta:true,rows:3})}</div>`).join("")}
  <div id="tFit" class="hidden"></div>`,

/* 2 — преимущества */
() => `<h2>Преимущества</h2>
  <p class="lead">Каждый экран — отдельная сцена с двумя блоками. Нумерация сквозная. Экраны добавляются парой блоков.</p>
  ${tField("adv.head","Заголовок (на всех экранах)",T_LIM.head,{ph:"Преимущества Solar AI Firewall"})}
  ${tField("adv.sub","Подзаголовок",T_LIM.sub,{ph:"Технологии защиты и экспертиза ГК «Солар»"})}
  ${T.adv.pairs.map((p,pi)=>`<div class="tscreen ${tSceneIdx('adv',pi)===T.view?'on':''}" data-tscr="${pi}">
    <div class="tscreen-h"><b>Экран ${pi+1}</b><span>сцена ${nn(pi+2)} · блоки ${nn(pi*2)} и ${nn(pi*2+1)}</span>
      <span class="tscreen-tools">
        <button class="btn sm ghost" data-tmv="${pi}:-1" ${pi===0?'disabled':''} title="Выше">↑</button>
        <button class="btn sm ghost" data-tmv="${pi}:1" ${pi===T.adv.pairs.length-1?'disabled':''} title="Ниже">↓</button>
        <button class="btn sm ghost" data-tdel="${pi}" ${T.adv.pairs.length<2?'disabled':''} title="Удалить экран">✕</button></span></div>
    ${p.map((c,ci)=>`<div class="tcard"><div class="tcard-h"><b>${nn(pi*2+ci)}</b>Блок ${pi*2+ci+1}</div>
      ${tField(`adv.pairs.${pi}.${ci}.title`,"Заголовок",T_LIM.aTitle,{ta:true})}
      ${tField(`adv.pairs.${pi}.${ci}.text`,"Текст",T_LIM.aText,{ta:true,rows:4})}</div>`).join("")}
  </div>`).join("")}
  <button class="btn" id="tAdd" style="width:100%;margin-top:12px">＋ Добавить экран (2 блока)</button>
  <div id="tFit" class="hidden"></div>`,

/* 3 — тайминг */
() => { const sc=tScenes(); return `<h2>Тайминг</h2>
  <p class="lead">Длительность каждой сцены. Анимацию появления и переходы возьмём из проекта AE — здесь только время на экране.</p>
  <div class="tdur">${sc.map((s,i)=>`<div class="${i===T.view?'on':''}" data-tview="${i}"><span>${nn(i)}</span><b>${esc(s.name)}</b>
    <input class="input" type="number" min="2" max="60" step="0.5" value="${s.dur}" data-tdur="${s.id}"><small>с</small></div>`).join("")}</div>
  <div class="tstat" style="grid-template-columns:repeat(2,1fr)"><div><small>Сцен</small><b>${sc.length}</b></div><div class="o"><small>Ролик</small><b>${fmt(tTotal())}</b></div></div>
  <p class="hint">Совет: время на чтение — примерно 1 с на 2–3 слова текста в сцене.</p>`; },

/* 4 — отправка */
() => { const sc=tScenes(); return `<h2>Отправка</h2>
  <p class="lead">Заявка собирается в JSON: по нему скрипт соберёт сцены в AE, когда добавим шаблон анимации.</p>
  <dl class="sum">
    <dt>Продукт</dt><dd>${esc(T.product)}</dd>
    <dt>Сцены</dt><dd>${sc.map((s,i)=>`${nn(i)} · ${esc(s.name)} — ${s.dur} с`).join("<br>")}</dd>
    <dt>Ролик</dt><dd>${fmt(tTotal())} · 1920×1080, 25 fps</dd>
  </dl>
  <label class="f">Контакт для связи</label>
  <input class="input" id="tContact" placeholder="Имя и Telegram / почта" value="${esc(S.contact)}">
  <label class="f">Пожелания <span>необязательно</span></label>
  <textarea class="input" id="tNotes" placeholder="Например: экран в переговорке, без звука, нужно к понедельнику">${esc(T.notes)}</textarea>
  <div class="dl"><button class="btn" id="tDl">⬇ JSON заявки <small>${esc(tJsonName())}</small></button></div>`; }
];
function tSceneIdx(kind,pair){ return kind==="adv" ? 2+pair : kind==="features"?1:0; }

/* ---- рендер ---- */
function tRender(){
  if(T.sent) return tRenderSent();
  const bars=$("#bars"); bars.style.gridTemplateColumns=`repeat(${T_STEPS.length},1fr)`;
  bars.innerHTML=T_STEPS.map((n,i)=>`<button class="${i===T.step?'cur':i<T.step?'done':''}" title="${n}" data-tgo="${i}"></button>`).join("");
  bars.querySelectorAll("[data-tgo]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.tgo; if(i<T.step) tGo(i); });
  $("#stepBody").innerHTML = `<div class="stephead"><span class="n">${T.step+1}</span>${T_STEPS[T.step]}<span class="of">шаг ${T.step+1} из ${T_STEPS.length}</span></div>` + T_VIEWS[T.step]();
  $("#back").style.visibility = T.step===0?"hidden":"visible";
  $("#next").textContent = T.step===T_STEPS.length-1 ? (live()?"Отправить в работу":"Скачать JSON") : "Дальше";
  tBind(); tFitWarn(); $("#next").disabled=!tCan(); tRenderRight();
}
function tBind(){
  const B=$("#stepBody");
  B.querySelectorAll("[data-tf]").forEach(el=>{
    el.oninput=()=>{ const path=el.dataset.tf; tSet(path, el.value.replace(/[\r\n]+/g," "));
      const c=B.querySelector(`[data-tcnt="${CSS.escape(path)}"]`); if(c) c.textContent=`${el.value.length} / ${el.maxLength}`;
      const m=/^adv\.pairs\.(\d+)/.exec(path); if(m) T.view=2+ +m[1]; else if(path.startsWith("feat")) T.view=1; else T.view=0;
      tFitWarn(); $("#next").disabled=!tCan(); tRenderRight(); };
    el.onfocus=()=>{ const m=/^adv\.pairs\.(\d+)/.exec(el.dataset.tf); if(m && T.view!==2+ +m[1]){ T.view=2+ +m[1]; B.querySelectorAll("[data-tscr]").forEach(s=>s.classList.toggle("on",+s.dataset.tscr===+m[1])); tRenderRight(); } };
  });
  $("#tDemo")?.addEventListener("click",()=>{ const E=JSON.parse(JSON.stringify(T_EXAMPLE)); Object.assign(T,{product:E.product,desc:E.desc,feat:E.feat,adv:E.adv}); render(); });
  const pp=$("#tPptx"); if(pp){ pp.onclick=()=>$("#pptxIn").click(); pp.ondragover=e=>{e.preventDefault();pp.classList.add("over")}; pp.ondragleave=()=>pp.classList.remove("over"); pp.ondrop=e=>{e.preventDefault();pp.classList.remove("over"); e.dataTransfer.files[0]&&tImport(e.dataTransfer.files[0]);}; }
  $("#tAdd")?.addEventListener("click",()=>{ T.adv.pairs.push([newCard(),newCard()]); T.view=2+T.adv.pairs.length-1; render();
    setTimeout(()=>{ const last=[...document.querySelectorAll("[data-tscr]")].pop(); last?.scrollIntoView({behavior:"smooth",block:"start"}); last?.querySelector("textarea")?.focus(); },50); });
  B.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.tdel; const p=T.adv.pairs[i];
    if(p.some(c=>c.title||c.text) && !b.dataset.sure){ b.dataset.sure=1; b.textContent="Точно?"; return; }
    T.adv.pairs.splice(i,1); T.view=Math.min(T.view,2+T.adv.pairs.length-1); render(); });
  B.querySelectorAll("[data-tmv]").forEach(b=>b.onclick=()=>{ const [i,d]=b.dataset.tmv.split(":").map(Number); const P2=T.adv.pairs; [P2[i],P2[i+d]]=[P2[i+d],P2[i]]; T.view=2+i+d; render(); });
  B.querySelectorAll("[data-tscr]").forEach(s=>s.addEventListener("click",e=>{ if(e.target.closest("button,textarea,input")) return; T.view=2+ +s.dataset.tscr; render(); }));
  B.querySelectorAll("[data-tdur]").forEach(el=>el.oninput=()=>{ T.dur[el.dataset.tdur]=Math.max(0,parseFloat(el.value)||0); $("#next").disabled=!tCan(); const tb=B.querySelector(".tstat .o b"); if(tb) tb.textContent=fmt(tTotal()); });
  B.querySelectorAll("[data-tview]").forEach(d=>d.addEventListener("click",e=>{ if(e.target.tagName==="INPUT") return; T.view=+d.dataset.tview; render(); }));
  const tc=$("#tContact"); if(tc) tc.oninput=()=>{ S.contact=tc.value; store("ms_contact",tc.value); $("#next").disabled=!tCan(); };
  const tn=$("#tNotes"); if(tn) tn.oninput=()=>{ T.notes=tn.value; };
  $("#tDl")?.addEventListener("click",tDownload);
}

/* ---- превью сцен (по слайдам презентации, кадр 1920×1080) ---- */
function tSceneHTML(i, light){
  const sc=tScenes()[i]; if(!sc) return "";
  const ph=(v,d)=>String(v||"").trim()?esc(v):`<span class="ex">${esc(d)}</span>`;
  const head = (h,s,hd,sd) => `<div class="tv-top"><span>${ph(T.product,"Название продукта")}</span><i></i></div>
    <img class="tv-logo" alt="Solar" src="${LOGO.color}">
    <div class="tv-h" style="top:${hd}px">${ph(h,"Заголовок")}</div><div class="tv-s" style="top:${sd}px">${ph(s,"Подзаголовок")}</div>`;
  let body="";
  if(sc.kind==="title"){
    body=`<img class="tv-logo-big" alt="Solar" src="${LOGO.color}">
      <div class="tv-title">${ph(T.product,"Название продукта")}</div>
      <div class="tv-desc">${ph(T.desc,"Описание продукта")}</div>`;
  } else if(sc.kind==="features"){
    const pos=[[72,342],[1004,342],[72,702],[1004,702]];
    body=head(T.feat.head,T.feat.sub,100,214)+T.feat.cards.map((c,k)=>`<div class="tv-card f" data-blk style="left:${pos[k][0]}px;top:${pos[k][1]}px">
      <b>${nn(k)}</b><div class="tv-ct">${ph(c.title,"Заголовок карточки")}</div><div class="tv-cx">${ph(c.text,"Текст карточки")}</div></div>`).join("");
  } else {
    const p=T.adv.pairs[sc.pair]||[];
    body=head(T.adv.head,T.adv.sub,86,182)+p.map((c,k)=>`<div class="tv-card a" data-blk style="left:${k?976:72}px">
      <b>${nn(sc.pair*2+k)}</b><div class="tv-ct">${ph(c.title,"Заголовок блока")}</div><div class="tv-cx">${ph(c.text,"Текст блока")}</div></div>`).join("");
  }
  return `<div class="pvw tvw" data-w="1920" data-h="1080"><div class="fr tv" style="width:1920px;height:1080px">${body}</div></div>`;
}
function tRenderRight(){
  const R=$("#tRight"), sc=tScenes(); T.view=Math.min(T.view,sc.length-1);
  R.innerHTML=`<div class="rhead"><div><h3>Предпросмотр</h3><p>Сцена ${nn(T.view)} из ${sc.length} · ${esc(sc[T.view].name)}</p></div>
      <span class="tc">ролик ${fmt(tTotal())}</span></div>
    <div class="card">
      <div class="fmts tvtabs">${sc.map((s,i)=>`<button class="${i===T.view?'on':''}" data-tv="${i}" title="${esc(s.name)}">${nn(i)}</button>`).join("")}</div>
      ${tSceneHTML(T.view)}
      <div class="cardfoot"><b>${esc(sc[T.view].id)}</b><span class="tc">${sc[T.view].dur} с · по слайду презентации, анимация — из AE</span></div>
    </div>
    <div class="card tvstrip">${sc.map((s,i)=>`<div class="tvs ${i===T.view?'on':''}" data-tv="${i}" style="flex:${s.dur}"><b>${nn(i)}</b><span>${esc(s.name)}</span><small>${s.dur} с</small></div>`).join("")}</div>`;
  R.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{ T.view=+b.dataset.tv; tRenderRight(); });
  tFitAll();
}
function tFitAll(){
  document.querySelectorAll("#tRight .pvw").forEach(w=>{ const W=+w.dataset.w,H=+w.dataset.h,cw=w.parentElement.clientWidth,k=Math.min(cw/W,620/H);
    w.style.width=W*k+"px"; w.style.height=H*k+"px"; w.firstElementChild.style.transform=`scale(${k})`; });
}
addEventListener("resize",()=>{ if(MODE==="tv") tFitAll(); });

/* ---- влезает ли текст: рисуем сцены шага вне экрана и меряем блоки ---- */
function tOverflow(){
  const idx = T.step===0?[0] : T.step===1?[1] : T.step===2? T.adv.pairs.map((_,i)=>2+i) : [];
  const host=document.createElement("div"); host.style.cssText="position:fixed;left:-99999px;top:0;visibility:hidden"; document.body.appendChild(host);
  const bad=[];
  idx.forEach(i=>{ host.innerHTML=tSceneHTML(i,true);
    host.querySelectorAll("[data-blk],.tv-desc,.tv-title,.tv-h,.tv-s").forEach(b=>{ if(b.scrollHeight>b.clientHeight+1 || b.scrollWidth>b.clientWidth+1) bad.push({i, what:b.matches("[data-blk]")?"блок "+b.querySelector("b").textContent:b.className.replace("tv-","")}); }); });
  host.remove(); return bad;
}
function tFitWarn(){
  const el=$("#tFit"); if(!el) return; const o=tOverflow();
  const names={title:"название", desc:"описание", h:"заголовок", s:"подзаголовок"};
  el.className=o.length?"fitwarn":"hidden";
  el.innerHTML=o.length?`<b>Не влезает в сцену:</b> ${o.map(x=>`сцена ${nn(x.i)} — ${names[x.what]||x.what}`).join("; ")}. Сократите текст.`:"";
}

/* ---- импорт PPTX ---- */
function loadJSZip(){ return window.JSZip ? Promise.resolve(window.JSZip) : new Promise((ok,fail)=>{ const s=document.createElement("script"); s.src="vendor/jszip.min.js"; s.onload=()=>ok(window.JSZip); s.onerror=()=>fail(new Error("не загрузилась библиотека JSZip")); document.head.appendChild(s); }); }
async function tImport(file){
  try{
    const JSZip=await loadJSZip(), zip=await JSZip.loadAsync(file);
    const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
    const A="http://schemas.openxmlformats.org/drawingml/2006/main";
    const slides=[];
    for(const n of names){
      const doc=new DOMParser().parseFromString(await zip.file(n).async("string"),"application/xml");
      const items=[...doc.getElementsByTagName("p:sp")].map(sp=>{
        const off=sp.getElementsByTagNameNS(A,"off")[0];
        const paras=[...sp.getElementsByTagNameNS(A,"p")].map(p=>[...p.childNodes].map(r=>r.localName==="br"?" ":[...r.getElementsByTagNameNS(A,"t")].map(t=>t.textContent).join("")).join("")).filter(Boolean);
        const text=paras.join(" ").replace(/\s+/g," ").trim();
        const rpr=sp.getElementsByTagNameNS(A,"rPr")[0]; const sz=rpr? +rpr.getAttribute("sz")/100 : 0;
        return {text, sz, x:off?+off.getAttribute("x")/9525:0, y:off?+off.getAttribute("y")/9525:0};
      }).filter(t=>t.text);
      slides.push(items);
    }
    const isNum=t=>/^\d{1,2}$/.test(t.text);
    const cardsOf=items=>{ const nums=items.filter(isNum).sort((a,b)=>a.y-b.y||a.x-b.x);
      return nums.map(N=>{ const below=nums.filter(M=>M!==N && Math.abs(M.x-N.x)<60 && M.y>N.y).map(M=>M.y);
        const yMax=below.length?Math.min(...below)-10:1e9;
        const own=items.filter(t=>!isNum(t) && t.x>=N.x-30 && t.x<N.x+560 && t.y>=N.y-12 && t.y<yMax).sort((a,b)=>a.y-b.y||a.x-b.x);
        const tt=own.slice().sort((a,b)=>b.sz-a.sz)[0]; const tx=own.filter(t=>t!==tt);
        return {n:N.text, x:N.x, y:N.y, title:tt?.text||"", text:tx.map(t=>t.text).join(" ")}; }).sort((a,b)=>+a.n-+b.n); };
    const headOf=items=>{ const top=items.filter(t=>!isNum(t) && t.y<220 && t.sz>=12).sort((a,b)=>a.y-b.y); const h=top.slice().sort((a,b)=>b.sz-a.sz)[0]; const s=top.filter(t=>t!==h && t.y>(h?.y||0)).sort((a,b)=>a.y-b.y)[0]; return {head:h?.text||"", sub:s?.text||""}; };
    let feat=null; const advCards=[]; let advHead=null; let titleSl=null;
    slides.forEach(items=>{ const cards=cardsOf(items);
      if(!cards.length){ if(!titleSl) titleSl=items; return; }
      if(cards.length>=3 && !feat){ feat={...headOf(items), cards}; return; }
      if(!advHead) advHead=headOf(items); advCards.push(...cards); });
    if(titleSl){ const s=titleSl.slice().sort((a,b)=>b.sz-a.sz); T.product=(s[0]?.text||"").slice(0,T_LIM.product); T.desc=(s[1]?.text||"").slice(0,T_LIM.desc); }
    if(feat){ T.feat.head=feat.head.slice(0,T_LIM.head); T.feat.sub=feat.sub.slice(0,T_LIM.sub); T.feat.cards=[0,1,2,3].map(k=>({title:(feat.cards[k]?.title||"").slice(0,T_LIM.fTitle), text:(feat.cards[k]?.text||"").slice(0,T_LIM.fText)})); }
    if(advCards.length){ T.adv.head=(advHead?.head||"").slice(0,T_LIM.head); T.adv.sub=(advHead?.sub||"").slice(0,T_LIM.sub); T.adv.pairs=[];
      for(let k=0;k<advCards.length;k+=2) T.adv.pairs.push([0,1].map(d=>({title:(advCards[k+d]?.title||"").slice(0,T_LIM.aTitle), text:(advCards[k+d]?.text||"").slice(0,T_LIM.aText)}))); }
    T.imported=`${file.name}: ${slides.length} слайдов → титул, ${feat?4:0} карточек, ${advCards.length} блоков преимуществ`;
    toast("Презентация разложена по сценам — проверьте тексты"); render();
  }catch(e){ toast("Не удалось прочитать презентацию: "+e.message); }
}

/* ---- JSON ---- */
function tJsonName(){ return `TV_${(T.product||"rolik").replace(/[^\p{L}\d]+/gu,"_").replace(/^_|_$/g,"")}.json`; }
function tPayload(){
  const sc=tScenes(); let t=0;
  return { type:"tv_office", version:1, format:{width:1920,height:1080,fps:25}, product:T.product.trim(),
    scenes: sc.map(s=>{ const o={id:s.id, kind:s.kind, start:Math.round(t*100)/100, duration:s.dur}; t+=s.dur;
      if(s.kind==="title") Object.assign(o,{title:T.product.trim(), description:T.desc.trim()});
      else if(s.kind==="features") Object.assign(o,{heading:T.feat.head.trim(), subheading:T.feat.sub.trim(), cards:T.feat.cards.map((c,i)=>({n:nn(i), title:c.title.trim(), text:c.text.trim()}))});
      else Object.assign(o,{heading:T.adv.head.trim(), subheading:T.adv.sub.trim(), cards:T.adv.pairs[s.pair].map((c,k)=>({n:nn(s.pair*2+k), title:c.title.trim(), text:c.text.trim()}))});
      return o; }),
    total:Math.round(t*100)/100, contact:S.contact.trim(), notes:T.notes.trim(), kaiten:S.kaiten||null };
}
function tDownload(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(tPayload(),null,2)],{type:"application/json"})); a.download=tJsonName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("JSON скачан: "+tJsonName()); }
async function tNext(){
  if(!tCan()) return;
  if(T.step<T_STEPS.length-1) return tGo(T.step+1);
  if(!live()) return tDownload();
  const btn=$("#next"); btn.disabled=true; btn.textContent="Создаём задачу…";
  try{ const j=await api("/submit",{payload:tPayload()}); T.sent={id:j.id,issue:j.issue_url}; tDownload(); tRenderSent(); }
  catch(e){ btn.disabled=false; btn.textContent="Отправить в работу"; toast("Ошибка: "+e.message); }
}
function tRenderSent(){
  $("#stepBody").innerHTML=`<div class="stephead"><span class="n">✓</span>Заявка #${T.sent.id}</div><h2>Заявка отправлена</h2>
    <p class="lead">JSON сохранён у вас и лежит в задаче на GitHub.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn acc" id="tDl2">⬇ JSON ещё раз</button>${T.sent.issue?`<a class="btn" href="${esc(T.sent.issue)}" target="_blank" style="text-decoration:none">Задача на GitHub ↗</a>`:""}</div>`;
  $("#tDl2").onclick=tDownload; $("#back").style.visibility="hidden"; $("#next").textContent="Новая заявка"; $("#next").disabled=false; $("#next").onclick=()=>location.reload();
}
$("#pptxIn").onchange=e=>{ const f=e.target.files[0]; if(f) tImport(f); e.target.value=""; };
if(location.hash==="#tv") setMode("tv");
</script>
